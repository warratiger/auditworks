<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Audit Logic Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky tab bar over four panels. The Map panel is a two-column grid (diagram | detail), one column at phone width.
   Chrome is monochrome ledger-green greys; hue is reserved for the six topic branches so colour always means "which topic". */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --fg:#14201D; --muted:#55665F; --line:#D3DDD9; --soft:#E6EDEA;
  --bA:#7B4FA8; --bB:#A5600A; --bC:#2358B8; --bD:#2C7A4B; --bE:#0C7185; --bG:#B02F5A; --bX:#5C6B66;
  --on:#FFFFFF;
  --stop:#B3261E; --go:#1E7A45; --wait:#8F5F00; --alert:#A32B63; --info:#4B5B56;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#15211E; --fg:#E5EEEB; --muted:#9BADA7; --line:#2A3F39; --soft:#1D2D29;
    --bA:#BE9EE3; --bB:#EBA85A; --bC:#86A9EE; --bD:#7FCB9A; --bE:#62C6DA; --bG:#EE8FAE; --bX:#8FA19B;
    --on:#0E1614;
    --stop:#F2897F; --go:#7FCB9A; --wait:#E3B656; --alert:#EE8FAE; --info:#9BADA7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15211E; --fg:#E5EEEB; --muted:#9BADA7; --line:#2A3F39; --soft:#1D2D29;
  --bA:#BE9EE3; --bB:#EBA85A; --bC:#86A9EE; --bD:#7FCB9A; --bE:#62C6DA; --bG:#EE8FAE; --bX:#8FA19B;
  --on:#0E1614;
  --stop:#F2897F; --go:#7FCB9A; --wait:#E3B656; --alert:#EE8FAE; --info:#9BADA7;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-ui);}
*{box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1{font:600 30px/1.15 var(--font-head);margin:0 0 6px;letter-spacing:.2px}
h2,h3{font-family:var(--font-head);text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:70ch}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;font:600 15px var(--font-head);letter-spacing:.2px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}

.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font:500 12.5px/1.4 var(--font-ui);cursor:pointer;text-align:left}
.chip::before{content:"";flex:none;width:9px;height:9px;border-radius:2px;background:var(--c,var(--bX))}
.chip.next::before{background:transparent;border:1.5px dashed var(--c,var(--bX))}
.chip:hover{border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mono{font-family:var(--font-mono);font-size:12px}

/* Chain */
.chain{list-style:none;margin:0;padding:0;max-width:820px}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px}
.rail{position:relative;display:flex;flex-direction:column;align-items:center}
.rail::after{content:"";flex:1;width:2px;background:var(--line);margin-block:4px}
.step:last-child .rail::after{display:none}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;font:500 13px var(--font-mono);background:var(--bg)}
.stepbody{padding-bottom:26px;min-width:0}
.from{margin:2px 0 4px;color:var(--muted);font-size:13.5px}
.stepbody h3{margin:0 0 6px;font-size:21px;line-height:1.25;font-weight:600}
.stepbody p{margin:0 0 10px;max-width:68ch}

/* Map */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 0 10px;color:var(--muted);font-size:13px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend svg{display:block}
.toolbar{display:flex;gap:8px;margin-left:auto}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font:500 13px var(--font-ui);cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn[aria-pressed="true"]{border-color:var(--fg);background:var(--soft)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.mapbox{border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:auto;max-height:74vh}
.mapbox svg{display:block}
.detail{position:sticky;top:62px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px;max-height:calc(100vh - 84px);overflow:auto;min-width:0}
.detail h3{margin:6px 0 8px;font-size:21px;line-height:1.2}
.detail h4{margin:14px 0 4px;font:600 12px var(--font-ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.detail p{margin:0 0 6px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font:600 11.5px var(--font-ui);letter-spacing:.3px}
.pill.branch{background:var(--c);color:var(--on)}
.pill.taught{border:1px solid var(--fg)}
.pill.coming{border:1px dashed var(--muted);color:var(--muted)}
.term{background:var(--soft);border-radius:6px;padding:8px 10px;margin-top:4px}
.term .mono{display:block;margin-top:4px;color:var(--muted)}
.conn{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.conn .via{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 0 2px}
@media (max-width:900px){
  .mapgrid{grid-template-columns:minmax(0,1fr)}
  .detail{position:static;max-height:none}
  .mapbox{max-height:60vh}
}
.node{cursor:pointer}
.node rect.card{fill:var(--surface);stroke:var(--c);stroke-width:1.5}
.node.next rect.card{stroke-dasharray:4 3}
.node.rel rect.card{stroke-width:3}
.node.sel rect.card{fill:var(--soft);stroke:var(--fg);stroke-width:3;stroke-dasharray:none}
.node:hover rect.card{fill:var(--soft)}
.node:focus-visible{outline:none}
.node:focus-visible rect.card{stroke:var(--fg);stroke-width:3}
.lbl{font:500 12.5px var(--font-ui);fill:var(--fg);pointer-events:none}
.node.next .lbl{fill:var(--muted)}
.blbl{font:600 13px var(--font-head);fill:var(--on);pointer-events:none}
.rlbl{font:600 13.5px var(--font-head);fill:var(--bg);pointer-events:none}
.bnode rect{fill:var(--c)}
.bnode.next rect{fill:var(--surface);stroke:var(--c);stroke-width:1.5;stroke-dasharray:4 3}
.bnode.next .blbl{fill:var(--fg)}
.bnode.sel rect{stroke:var(--fg);stroke-width:3;stroke-dasharray:none}
.tick{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ring{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 2}
.conn-line{fill:none;stroke:var(--line);stroke-width:1.6}
.arc{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-dasharray:5 3;opacity:.75}
.arcdot{fill:var(--fg)}

/* Decisions */
.dpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:20px;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.scen h3{margin:0 0 6px;font-size:18px}
.scen p{margin:0 0 10px}
.sugg{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:6px}
.note-small{color:var(--muted);font-size:13px;margin:10px 0 0}
.walker{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.wpath{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px}
.wpath li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13.5px;color:var(--muted)}
.wpath b{font:600 11.5px var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--fg);align-self:start}
.qtext{font:600 19px/1.35 var(--font-head);margin:0 0 10px;text-wrap:balance}
.qmeta{color:var(--muted);font-size:12.5px;margin:0 0 8px;font-family:var(--font-mono)}
details.why{margin:0 0 14px}
details.why summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details.why p{margin:6px 0 0;max-width:62ch}
.answers{display:flex;flex-wrap:wrap;gap:8px}
.ans{min-width:96px;padding:9px 18px;border-radius:6px;border:1.5px solid var(--fg);background:var(--surface);font:600 15px var(--font-head);cursor:pointer}
.ans:hover{background:var(--fg);color:var(--bg)}
.wnav{display:flex;gap:8px;margin-top:14px}
.out{border-left:6px solid var(--t);padding:2px 0 2px 14px}
.tone-stop{--t:var(--stop)}.tone-go{--t:var(--go)}.tone-wait{--t:var(--wait)}.tone-alert{--t:var(--alert)}.tone-info{--t:var(--info)}
.tonepill{display:inline-block;background:var(--t);color:var(--on);font:600 12px var(--font-ui);letter-spacing:.6px;text-transform:uppercase;padding:2px 10px;border-radius:4px;margin-bottom:8px}
.out .qtext{margin-bottom:8px}
.out p{margin:0 0 8px;max-width:62ch}
details.all{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.all summary{cursor:pointer;font-weight:600}
details.all ol{margin:10px 0 0;padding-left:22px;display:grid;gap:8px}
details.all li{min-width:0}
details.all .route{display:block;color:var(--muted);font-size:12.5px;font-family:var(--font-mono)}

/* Threads */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.thread h3{margin:0 0 6px;font-size:18px}
.thread p{margin:0 0 10px;max-width:60ch}
.tpath{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tpath .arrow{color:var(--muted);font-family:var(--font-mono)}
.intro{max-width:70ch;margin:0 0 16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

  <header>
    <h1>Audit Logic Map</h1>
    <p class="lede">One chain of questions that connects ISA 200, 210, 220, 300, 315, 320 and 450. Four views of the same material. It grows with each standard we add.</p>
  </header>

<script>
(function(){
'use strict';

/* ---------- DATA ---------- */
const BR = {
  A:{n:'Trust & premise',c:'--bA',st:'done',blurb:`Why the audit exists and what must be true before it starts.`},
  B:{n:'Limits & materiality',c:'--bB',st:'done',blurb:`Why certainty is impossible and how materiality draws the line.`},
  C:{n:'Language of risk',c:'--bC',st:'done',blurb:`The vocabulary for "how likely is this to be wrong".`},
  D:{n:'Planning',c:'--bD',st:'done',blurb:`Organising the work before and while risks are found.`},
  E:{n:'Finding the risks',c:'--bE',st:'done',blurb:`Diagnosing the entity: where could the accounts mislead? Entity understanding is taught; controls and final assessment are next.`},
  F:{n:'Responding (coming)',c:'--bX',st:'next',blurb:`What to do about assessed risks, and what counts as evidence. Previewed from cross-reads, taught in coming installments.`},
  G:{n:'Misstatements found',c:'--bG',st:'done',blurb:`What to do when the work turns up errors.`},
  H:{n:'Opinion (coming)',c:'--bX',st:'next',blurb:`Turning the conclusions into an opinion and a report.`}
};
const BR_ORDER=['A','B','C','D','E','F','G','H'];

const NODES=[
{id:'a1',b:'A',st:'done',label:`The trust gap`,
 q:`Why would anyone believe accounts written by people who benefit from them?`,
 idea:`The bank cannot check every figure and cannot simply trust the author. So an independent person examines the accounts and says whether they follow the reporting rules. The opinion is about the rules being followed. It says nothing about whether the business will survive or is well run.`,
 term:`Opinion on whether the financial statements are prepared, in all material respects, in accordance with the applicable financial reporting framework.`,
 ref:`ISA 200 paras 3, 8; A1`, feeds:`Everything. Each later rule is tested against this purpose.`},
{id:'a2',b:'A',st:'done',label:`The premise: management's 3 duties`,
 q:`What must be true before an opinion is even possible?`,
 idea:`Think of a building inspector. She checks the wiring but did not install it, and she cannot inspect an attic the owner will not open. So management must accept three duties: prepare the accounts (otherwise the auditor would check her own work), keep the controls it decides are necessary, and give access to information, to extra information on request, and to the people the auditor needs.`,
 term:`The premise on which an audit is conducted.`,
 ref:`ISA 200 para 4, 13(j); A2-A11`, feeds:`The gate (A3). If it fails mid-audit, see A4.`},
{id:'a3',b:'A',st:'done',label:`The gate: can we, should we?`,
 q:`Should the audit start at all?`,
 idea:`Two checks. Can it be audited: is the framework acceptable, has management accepted the premise, and is there no management-imposed limit that would force a disclaimer? Should we do it: do ethics and independence allow it, is management's integrity in doubt, does the firm have the people and time? What you learn here is not filed away.`,
 term:`Preconditions for an audit; acceptance and continuance.`,
 ref:`ISA 210 paras 6-8; ISA 220 paras 16-24; ISA 300 para 6`, feeds:`Strategy (D2) and risk assessment (E1). Decision tree: Take the engagement?`},
{id:'a4',b:'A',st:'done',label:`When the premise fails`,
 q:`What if the auditor cannot get what the premise promises?`,
 idea:`If reasonable assurance cannot be reached and a qualified opinion would not be enough for readers, the auditor disclaims an opinion or withdraws where the law permits. Failing an objective in any ISA must be weighed against the overall objectives and documented.`,
 term:`Disclaim or withdraw; failure to achieve an objective.`,
 ref:`ISA 200 paras 12, 24; A82-A83`, feeds:`Modified opinions (H2, coming).`},
{id:'a5',b:'A',st:'done',label:`Ethics, skepticism, judgment`,
 q:`What does the auditor bring to the work?`,
 idea:`Independence of mind and in appearance, so the bank can trust the opinion. Professional skepticism, an attitude of questioning that applies even with a client who has always been honest. Professional judgment, which decides materiality, how much testing, and whether evidence is enough. Judgments are documented so an experienced stranger could follow them.`,
 term:`Ethical requirements; professional skepticism; professional judgment.`,
 ref:`ISA 200 paras 14-16; A17-A30`, feeds:`Used at every stage. See the skepticism thread.`},

{id:'b1',b:'B',st:'done',label:`Reasonable, not absolute, assurance`,
 q:`Can an audit give certainty?`,
 idea:`No, for three reasons. Accounts rest on judgment, often with a range of acceptable answers. Procedures have limits: information can be withheld, documents forged by collusion, and the auditor is not an investigator with search powers. And time and cost are real. Even so, difficulty or cost never justifies accepting less than persuasive evidence, and a misstatement found later does not by itself show the audit was done badly.`,
 term:`Inherent limitations of an audit; reasonable assurance.`,
 ref:`ISA 200 para 5; A50-A57`, feeds:`Evidence must be persuasive (F3). Detection risk (C2).`},
{id:'b2',b:'B',st:'done',label:`Materiality: the mesh size`,
 q:`If not everything can be perfect, which errors matter?`,
 idea:`Picture a fishing net. The mesh size is the smallest fish you care about. Materiality is that mesh: the size of error that could change a reader's decision, judged for readers as a group and not for one particular bank. Size is not the only test. Some items matter because of what they are.`,
 term:`Materiality.`,
 ref:`ISA 320 paras 2-6; ISA 200 para 6`, feeds:`Set early as a planning input (D2). Used in risk assessment, extent of procedures and evaluation of misstatements.`},
{id:'b3',b:'B',st:'done',label:`Benchmark × percentage`,
 q:`How do you turn what readers care about into a number?`,
 idea:`Pick the figure readers watch: profit, revenue or assets, depending on the entity. Apply a percentage as a starting point, by judgment. Use expected and normalised figures because actuals are not known yet. If an owner-manager takes most profit as remuneration, profit before that remuneration may be the better benchmark.`,
 term:`Benchmark and percentage.`,
 ref:`ISA 320 para 10; A3-A10`, feeds:`Documented with the factors behind it (ISA 320 para 14).`},
{id:'b4',b:'B',st:'done',label:`Lower levels for special items`,
 q:`Do some items matter at smaller amounts?`,
 idea:`Yes, where law, the framework or the industry make readers sensitive to them: related party transactions, management remuneration, key disclosures. Set a lower level for those classes.`,
 term:`Materiality levels for particular classes of transactions, account balances or disclosures.`,
 ref:`ISA 320 para 10; A11-A12`, feeds:`Applied again when judging uncorrected items (G8).`},
{id:'b5',b:'B',st:'done',label:`Performance materiality (headroom)`,
 q:`Why not search only for errors at exactly that size?`,
 idea:`Ten errors of 15,000 are each small and together large. And you will miss some. So you work to a finer mesh: a lower working amount that leaves headroom for what you cannot see.`,
 term:`Performance materiality; aggregation risk.`,
 ref:`ISA 320 paras 9, 11; A13`, feeds:`Sets how much work further procedures need. The tally of found errors uses it up (G4).`},
{id:'b6',b:'B',st:'done',label:`Revise when facts move`,
 q:`Materiality was set early. What if reality differs?`,
 idea:`If information arrives that would have produced a different number, revise it. If the new figure is lower, ask whether the working amount and the planned procedures still fit. My reading of why only a lower figure triggers this: work already done was designed for a coarser mesh.`,
 term:`Revision of materiality.`,
 ref:`ISA 320 paras 12-13; A14; ISA 450 para 10`, feeds:`Recalibration at the end (G7).`},

{id:'c1',b:'C',st:'done',label:`Assertions: ways a line can be false`,
 q:`To find where accounts could be wrong, in how many ways can one line be wrong?`,
 idea:`A customs declaration claims several separate things: the goods exist, they are yours, everything is declared, the value is right. Any can be false while the others hold. A line in the accounts is the same. For transactions: occurred, complete, accurate, right period, right classification, properly presented. For balances: exists, rights and obligations, complete, accurate, valued correctly, classified and presented properly. These are not the written representations letter from management.`,
 term:`Assertions.`,
 ref:`ISA 315 para 12(a); A1; A190-A191`, feeds:`Relevant assertions (C5). Procedures are aimed by assertion.`},
{id:'c2',b:'C',st:'done',label:`The risk model (the airport)`,
 q:`How likely is it that the opinion ends up wrong?`,
 idea:`Airport security has three layers. The passenger may be more likely to carry something prohibited (inherent risk, before any checks). The airline's own checks may catch or miss it (control risk). Gate screening is the last line (detection risk). The first two belong to the entity and can only be assessed. Detection risk is yours to set. When the first two are high, you can tolerate less chance of a miss at the gate, so the evidence must be more persuasive.`,
 term:`Audit risk; risk of material misstatement (inherent risk and control risk); detection risk. Inherent and control risk are assessed separately because they lead to different responses.`,
 ref:`ISA 200 13(c), 13(e), 13(n); A40-A48; ISA 315 paras 4-5`, feeds:`Extent of procedures (F2). Control risk is the next installment (E8).`},
{id:'c3',b:'C',st:'done',label:`Inherent risk factors`,
 q:`What makes one item more error-prone than another?`,
 idea:`Five qualities of how the figure is produced: complexity (hard to compute), subjectivity (judgment, several valid answers), change (new systems, acquisitions), uncertainty (cannot be known precisely), and bias or fraud pressure (incentives). Two qualities of the item itself: how much is at stake (in size or in nature), and how many items there are and how alike they are.`,
 term:`Inherent risk factors.`,
 ref:`ISA 315 para 12(f); A7-A8; Appendix 2`, feeds:`Likelihood and magnitude (C4).`},
{id:'c4',b:'C',st:'done',label:`Likelihood × magnitude: spectrum`,
 q:`How do you turn those qualities into how risky?`,
 idea:`Ask two questions. How possible is an error (likelihood)? How big or important would it be (magnitude)? Combine them into a place on a spectrum from lower to higher. A very high magnitude with low likelihood can still land high.`,
 term:`Spectrum of inherent risk.`,
 ref:`ISA 315 A208-A213`, feeds:`Which assertions are relevant (C5), which risks are significant (C6).`},
{id:'c5',b:'C',st:'done',label:`Relevant assertions & classes`,
 q:`Which claims actually carry a risk?`,
 idea:`An assertion is relevant when there is an identified risk of material misstatement. This is decided before looking at controls. If you assumed controls work first, you could never discover that they had failed. A class, balance or disclosure with at least one relevant assertion is significant.`,
 term:`Relevant assertion; significant class of transactions, account balance or disclosure.`,
 ref:`ISA 315 para 12(h), 12(k); A9`, feeds:`Decision tree: What status does this item get?`},
{id:'c6',b:'C',st:'done',label:`Significant risk`,
 q:`Which risks need the most demanding response?`,
 idea:`Those near the upper end of the spectrum, plus risks other standards force you to treat as significant. Two such cases named in the standards: assessed fraud risks, and significant related party transactions outside the normal course of business.`,
 term:`Significant risk.`,
 ref:`ISA 315 para 12(l); A10; ISA 240 para 28; ISA 550 para 18`, feeds:`Stronger response (F2) and fraud work (F4).`},
{id:'c7',b:'C',st:'done',label:`Whole-statement vs assertion level`,
 q:`Is every risk about one line?`,
 idea:`No. Some risks are pervasive: a weak control environment or a lack of accounting skills touches many assertions. Others sit on one assertion of one class. Pervasive risks shape who works on the audit and how closely they are supervised. Assertion-level risks shape the specific procedures.`,
 term:`Risks of material misstatement at the financial statement level and at the assertion level.`,
 ref:`ISA 200 A37-A38; ISA 315 A215`, feeds:`Overall responses (F1).`},
{id:'c8',b:'C',st:'done',label:`Material but not significant`,
 q:`Can a class escape testing because no risk was found?`,
 idea:`No. A class can be material, like an executive compensation disclosure, with no risk identified. It still gets substantive procedures. Materiality works as a safety net behind the risk assessment.`,
 term:`Material classes, balances or disclosures that are not significant.`,
 ref:`ISA 315 A233-A234; ISA 330 para 18`, feeds:`Substantive procedures (F2).`},

{id:'d1',b:'D',st:'done',label:`Planning: a chain, not a circle`,
 q:`How can planning come first yet depend on risk assessment?`,
 idea:`Compare it to surveying a site before building. You plan the survey from what you already know. The results then drive the foundation design. Three different things are planned with different inputs: the risk assessment work (early), the strategy (early but provisional) and the specific further procedures (after risk assessment, except fixed-date events that can start sooner).`,
 term:`Planning is continual and iterative.`,
 ref:`ISA 300 A3, A9, A15; ISA 315 para 7`, feeds:`Decision tree: Decide now or wait?`},
{id:'d2',b:'D',st:'done',label:`Overall strategy`,
 q:`Before daily routes, which peak, which season, which team?`,
 idea:`The strategy fixes scope, timing and direction. It draws on the characteristics of the engagement, the reporting deadlines and communications, the significant factors (materiality, areas expected to be risky, controls history, changes), what the gate taught you, and the resources needed. It is provisional until risk assessment is complete.`,
 term:`Overall audit strategy.`,
 ref:`ISA 300 paras 7-8; A9-A13; Appendix`, feeds:`Audit plan (D3).`},
{id:'d3',b:'D',st:'done',label:`Audit plan`,
 q:`What exactly will each person do?`,
 idea:`The plan is more detailed than the strategy. It sets the direction, supervision and review of the team, the planned risk assessment procedures, the planned further procedures (what kind, when, how much), and anything else other ISAs require. Disclosures are planned early, like balances.`,
 term:`Audit plan: nature, timing and extent of procedures.`,
 ref:`ISA 300 para 9; A14-A17`, feeds:`Further procedures (F2).`},
{id:'d4',b:'D',st:'done',label:`Resources: need, supply, adjust`,
 q:`Who, how many, when, and how coordinated?`,
 idea:`Think of a surgical team. Who is in the room (nature), how many hands (amount), at which stage (timing), and how they communicate and check each other (direction). Planning works out what is needed. The quality standards ask whether it was supplied. Overall responses adjust the same levers when risk assessment says so.`,
 term:`Resources; direction, supervision and review.`,
 ref:`ISA 300 para 8(e); A1, A9; ISA 220 paras 25-27; ISA 330 A1`, feeds:`Overall responses (F1).`},
{id:'d5',b:'D',st:'done',label:`The team conference`,
 q:`How does the team pool what it knows?`,
 idea:`The partner and key team members discuss how the framework applies and where the statements could be misstated. The discussion puts particular weight on fraud and sets aside prior beliefs about management's honesty. One standard says who takes part, another says what is discussed, a third sets the tone.`,
 term:`Engagement team discussion.`,
 ref:`ISA 300 para 5; ISA 315 paras 17-18; ISA 240 para 16`, feeds:`Risk assessment (E1).`},
{id:'d6',b:'D',st:'done',label:`Update and document`,
 q:`What happens when reality differs from the plan?`,
 idea:`Update the strategy and plan when events or evidence differ from expectations. Example: tests of controls looked fine, but substantive tests find differences, so the control risk assessment was wrong. Document the strategy, the plan, significant changes and the reasons. The partner reviews both.`,
 term:`Updating and documenting the strategy and plan.`,
 ref:`ISA 300 paras 10-12; A18-A22`, feeds:`Documentation (F5).`},
{id:'d7',b:'D',st:'done',label:`First-year audits`,
 q:`What is extra in a first-year audit?`,
 idea:`Before starting: acceptance procedures and, if the auditor changed, communication with the predecessor. Planning may need to be wider because there is no history. Options include reviewing the predecessor's papers, weighing major issues discussed at selection, opening balance procedures and an extra firm-level review of the strategy.`,
 term:`Initial audit engagements.`,
 ref:`ISA 300 para 13; A24`, feeds:`Opening balances are ISA 510, not yet read.`},
{id:'d8',b:'D',st:'done',label:`Decide now or wait?`,
 q:`Which planning decisions can be fixed now, and which must wait?`,
 idea:`A decision can be fixed early if the risk assessment itself needs it (procedures, people, timetable, materiality, specialists) or if it is a fixed-date event in an area already expected to be risky. A decision that must respond to assessed risks (sample sizes, whether to rely on controls) must wait.`,
 term:`Sequencing of planning and risk assessment.`,
 ref:`ISA 300 A3, A15; ISA 330 paras 6-7`, feeds:`Decision tree: Decide now or wait?`},

{id:'e1',b:'E',st:'done',label:`Risk assessment procedures`,
 q:`How do you get the diagnosis?`,
 idea:`A doctor takes a history (inquiries of management and others), compares readings to normal (analytical procedures), examines the patient (observation and inspection), and reads the earlier records (acceptance information, other engagements, previous audits, checked for relevance). The procedures must not lean towards confirming what you expect. They can double as tests when that is efficient.`,
 term:`Risk assessment procedures.`,
 ref:`ISA 315 paras 13-16; A11-A41`, feeds:`Understanding the entity (E2-E6).`},
{id:'e2',b:'E',st:'done',label:`Entity: structure, governance, IT`,
 q:`What is the patient's constitution?`,
 idea:`Structure (single entity or group, legal versus operating), ownership and related parties, whether owners, governance and management are the same people, and the IT environment. Governance shows how well controls can be overseen. The auditor needs less depth than management has: enough to see where the business could mislead the accounts.`,
 term:`Organisational structure, ownership and governance.`,
 ref:`ISA 315 para 19(a)(i); A52-A60`, feeds:`Owner-manager thread. Synthesis (E7).`},
{id:'e3',b:'E',st:'done',label:`Business model & business risk`,
 q:`What threatens the numbers?`,
 idea:`Every business creates value somehow, and what threatens that process eventually threatens the accounts. Two shoe sellers, one with a shop and one online, face different risks with the same product. The auditor is not responsible for all business risks, only those that could cause a material misstatement.`,
 term:`Business model; business risk.`,
 ref:`ISA 315 para 12(b); A61-A67; Appendix 1`, feeds:`Pressure (E5), inherent risk factors (C3).`},
{id:'e4',b:'E',st:'done',label:`Industry, law, economy`,
 q:`What outside forces shape results and estimates?`,
 idea:`Industry (competition, cycles, technology), regulation (the reporting framework, law, tax, environmental rules, government policy) and the wider economy (interest rates, inflation, currency, availability of financing).`,
 term:`Industry, regulatory and other external factors.`,
 ref:`ISA 315 para 19(a)(ii); A68-A73; ISA 250 (Revised) para 13`, feeds:`Synthesis (E7).`},
{id:'e5',b:'E',st:'done',label:`Performance measures & pressure`,
 q:`What gets measured, and who is under pressure?`,
 idea:`People manage to what is measured: key indicators, covenants, budgets, bonuses. Pressure to hit a target creates room for bias and fraud. If nothing is measured or reviewed, errors may go undetected. Measuring performance is not the same as monitoring controls.`,
 term:`Entity's measures used to assess financial performance.`,
 ref:`ISA 315 para 19(a)(iii); A74-A81`, feeds:`Bias factor (C3). Reappears when judging misstatements (G8).`},
{id:'e6',b:'E',st:'done',label:`Framework & accounting policies`,
 q:`What rulebook applies, and how does this entity play?`,
 idea:`Know the framework and the accounting policies the entity has chosen, why they changed, and how new rules will be adopted. Evaluate whether the policies are appropriate and consistent with the framework. At the end of the audit the same evaluation becomes a conclusion.`,
 term:`Applicable financial reporting framework; accounting policies.`,
 ref:`ISA 315 paras 19(b), 20; A82-A84`, feeds:`Synthesis (E7).`},
{id:'e7',b:'E',st:'done',label:`Synthesis: where is it vulnerable?`,
 q:`So where is this entity vulnerable, and how much?`,
 idea:`Apply the inherent risk factors to everything learned. The result is a preliminary view of likelihood and magnitude for each assertion, before controls. It supports identifying risks and later assessing inherent risk.`,
 term:`How inherent risk factors affect susceptibility of assertions.`,
 ref:`ISA 315 para 19(c); A85-A89`, feeds:`Identification and assessment (E9).`},
{id:'e8',b:'E',st:'next',label:`Internal control system`,
 q:`What defences does the entity have?`,
 idea:`Coming next. The system of internal control has five components: control environment, the entity's risk assessment process, monitoring, the information system and communication, and control activities. This is where control risk comes from.`,
 term:`System of internal control.`,
 ref:`ISA 315 paras 21-27; A90-A183; Appendices 3-6`, feeds:`Control risk (C2).`},
{id:'e9',b:'E',st:'next',label:`Identify & assess the risks`,
 q:`How do the findings become assessed risks?`,
 idea:`Coming after controls. Identify risks at both levels, assess inherent risk and control risk separately, and decide which are significant. This produces what the response standard needs.`,
 term:`Identifying and assessing the risks of material misstatement.`,
 ref:`ISA 315 paras 28-38; A184-A241`, feeds:`Responses (F1, F2).`},

{id:'f1',b:'F',st:'next',label:`Overall responses`,
 q:`How do you respond at the level of the whole audit?`,
 idea:`Coming. From what we read in cross-checks: assign more experienced people or experts, change supervision, add unpredictability to the choice of procedures, stress skepticism. These are the same levers described in resource planning.`,
 term:`Overall responses to assessed risks.`,
 ref:`ISA 330 para 5; A1`, feeds:`Resources thread.`},
{id:'f2',b:'F',st:'next',label:`Nature, timing, extent of work`,
 q:`What work answers each assessed risk?`,
 idea:`Coming. Procedures must respond to the assessed risk. The extent grows with risk and with a lower working materiality. Testing at an interim date has brakes when risk is high or fraud is a concern. Material classes get substantive procedures whatever the assessed risk.`,
 term:`Further audit procedures: tests of controls and substantive procedures.`,
 ref:`ISA 330 paras 6-7, 18, 23; A11, A15`, feeds:`Evidence (F3).`},
{id:'f3',b:'F',st:'next',label:`Evidence: relevance & reliability`,
 q:`When does evidence count?`,
 idea:`Coming. Evidence is judged by relevance and reliability. Observation shows only one moment. The same procedure can serve as a risk assessment procedure, a test of controls or a substantive procedure.`,
 term:`Audit evidence.`,
 ref:`ISA 500 (not yet taught)`, feeds:`The conclusion on evidence feeds the opinion (H1).`},
{id:'f4',b:'F',st:'next',label:`Fraud`,
 q:`What changes when fraud is possible?`,
 idea:`Coming. Extra inquiries, extra attention to revenue and unusual relationships, assessed fraud risks treated as significant, and a prompt to ask whether a found error might be fraud.`,
 term:`Auditor's responsibilities relating to fraud.`,
 ref:`ISA 240 (partly read in cross-checks)`, feeds:`Fraud thread.`},
{id:'f5',b:'F',st:'next',label:`Quality management & documentation`,
 q:`What holds the quality and the file together?`,
 idea:`Coming. The firm's quality management system, the engagement-level duties of the partner, and the documentation requirements that evidence the judgments made.`,
 term:`Quality management; audit documentation.`,
 ref:`ISQM 1; ISA 220; ISA 230 (not yet taught)`, feeds:`Documentation thread.`},

{id:'g1',b:'G',st:'done',label:`Clearly trivial floor`,
 q:`What goes into the tally?`,
 idea:`Picture a bucket under a dripping tap. You need a floor: below it you ignore the drops. Clearly trivial is not the same as not material. It is a different order of smallness, and doubt means count it. A small item can fail the test by its nature, for example an undisclosed related party payment.`,
 term:`Clearly trivial; accumulation of misstatements.`,
 ref:`ISA 450 para 5; A2-A5`, feeds:`Documented as a threshold.`},
{id:'g2',b:'G',st:'done',label:`Factual, judgmental, projected`,
 q:`How firm is each item?`,
 idea:`A signed receipt, two experts disagreeing and a statistical inference are different kinds of evidence. Factual misstatements leave no doubt. Judgmental ones are differences from management's judgments that you consider unreasonable. Projected ones extend what a sample showed to the whole population.`,
 term:`Factual, judgmental and projected misstatements.`,
 ref:`ISA 450 A6; ISA 530 para 14; A18-A20`, feeds:`Evaluation (G8).`},
{id:'g3',b:'G',st:'done',label:`A misstatement is a symptom`,
 q:`Does this error mean there are others?`,
 idea:`A drip points to a pipe. Ask what caused it: a control that failed, an assumption applied everywhere, or possible fraud, which is unlikely to be isolated. If the cause is systemic, revisit the risk assessment, strategy and plan.`,
 term:`Evaluating the implications of identified misstatements.`,
 ref:`ISA 450 para 6(a); A7; ISA 330 para 25; ISA 240 para 36`, feeds:`Updating the plan (D6).`},
{id:'g4',b:'G',st:'done',label:`Headroom: what the tally misses`,
 q:`What does the tally leave out?`,
 idea:`The tally counts only what you found. As it approaches materiality, the errors you did not find (sampling risk and non-sampling risk) may push the total over. This is where the headroom built earlier gets used up.`,
 term:`Risk that undetected misstatements exceed materiality.`,
 ref:`ISA 450 para 6(b); A8; ISA 530 para 5`, feeds:`Revise strategy and plan (D6).`},
{id:'g5',b:'G',st:'done',label:`Management's clean-up isn't evidence`,
 q:`If management cleans up, is the problem solved?`,
 idea:`Management's own re-examination is not audit evidence. If management corrects a population, you test whether misstatements remain.`,
 term:`Additional audit procedures after management's investigation.`,
 ref:`ISA 450 para 7; A9`, feeds:`Further procedures.`},
{id:'g6',b:'G',st:'done',label:`Tell management; refusal is a clue`,
 q:`Why tell management, and what does a refusal tell you?`,
 idea:`Management owns the accounts, so you tell it about everything above the floor and ask for correction. Timely communication also lets management disagree. If it refuses, understand why. A pattern of favourable choices is an indicator of bias.`,
 term:`Communication and correction of misstatements.`,
 ref:`ISA 450 paras 8-9; A10-A13; ISA 700 para 12`, feeds:`Judging the tally (G8).`},
{id:'g7',b:'G',st:'done',label:`Recalibrate materiality`,
 q:`Is the planning number still right?`,
 idea:`The planning figure rested on estimates. Check it against actual results. If it falls, revisit the working amount and whether the procedures still give enough evidence.`,
 term:`Reassessment of materiality.`,
 ref:`ISA 450 para 10; A14-A15`, feeds:`Evaluation (G8).`},
{id:'g8',b:'G',st:'done',label:`Judge the tally`,
 q:`Is the bucket overflowing, and are any drops harmful whatever their size?`,
 idea:`Judge each item against its own class level. Judge the total against materiality. Then look at nature and circumstances: regulatory compliance, covenants, management compensation, ratios, trends, related parties, segment effects, omitted information. Offsetting is limited, and classification errors can matter through covenants and ratios. Prior-period uncorrected items count too.`,
 term:`Evaluating the effect of uncorrected misstatements.`,
 ref:`ISA 450 para 11; A16-A25`, feeds:`Decision tree: Found a difference, what now?`},
{id:'g9',b:'G',st:'done',label:`Governance and representations`,
 q:`Who else is told, and what does management confirm?`,
 idea:`Governance is told about uncorrected items. If there are many small ones, their number and total can be enough. Management is asked to confirm in writing that it believes the effects are immaterial. That is evidence of its position, not proof that the position is right. Where the owner-manager is also governance, one communication can cover both if it genuinely informs everyone.`,
 term:`Communication with those charged with governance; written representation.`,
 ref:`ISA 450 paras 12-14; A26-A29`, feeds:`Documentation.`},
{id:'g10',b:'G',st:'done',label:`Conclusion feeds the opinion`,
 q:`Where does the conclusion go?`,
 idea:`The conclusion on uncorrected misstatements joins two others: whether enough evidence has been obtained, and the evaluations of presentation and disclosure. Together they produce the conclusion on reasonable assurance.`,
 term:`Conclusion on whether uncorrected misstatements are material.`,
 ref:`ISA 450 para 1; ISA 700 para 11`, feeds:`The opinion (H1).`},

{id:'h1',b:'H',st:'next',label:`Forming the opinion`,
 q:`How does it all become an opinion?`,
 idea:`Coming. The conclusions on evidence, misstatements and presentation combine into the opinion.`,
 term:`Forming an opinion.`,
 ref:`ISA 700 (not yet taught)`, feeds:`The end of the chain.`},
{id:'h2',b:'H',st:'next',label:`Modified opinions & the report`,
 q:`What if the conclusions are not clean?`,
 idea:`Coming. The ladder from a qualified opinion to disclaiming or withdrawing, built out by ISA 705.`,
 term:`Modification of the opinion.`,
 ref:`ISA 705 (not yet taught)`, feeds:`The end of the chain.`}
];

const CHAIN=[
{from:`Start here.`,q:`Why would anyone believe accounts written by people who benefit from them?`,
 a:`They would not, without help. An independent person examines the accounts and says whether they follow the reporting rules. That opinion is the product, and every later rule exists to make it trustworthy.`,nodes:['a1']},
{from:`An opinion is only worth something if some things are true first.`,q:`What has to hold before an audit can happen?`,
 a:`Management accepts its duties (prepare, keep controls, give access), the framework is acceptable, and the auditor is independent, competent and resourced. You check this at the gate, and what you learn there travels forward.`,nodes:['a2','a3','a5']},
{from:`Even with all that in place, the auditor cannot check everything.`,q:`Can the auditor be certain?`,
 a:`No. Accounts involve judgment, procedures have limits, and time and cost are real. The promise is reasonable assurance, and the limits never excuse accepting weak evidence. If assurance cannot be reached, the options are a modified opinion, disclaiming, or withdrawing.`,nodes:['b1','a4']},
{from:`If certainty is off the table, you have to say which errors you care about.`,q:`How big must an error be to matter?`,
 a:`Big enough to change a reader's decision, judged for readers as a group. Pick the number readers watch, apply a percentage by judgment, and set lower levels for items that matter because of what they are.`,nodes:['b2','b3','b4']},
{from:`Having drawn the line, you could aim straight at it. That leaves no margin.`,q:`Why not search only for errors at that size?`,
 a:`Small errors add up, and some you will never find. So you work to a lower working amount that leaves headroom, and you revise it when facts move.`,nodes:['b5','b6']},
{from:`With a line and limited time, effort must go where errors are most likely.`,q:`How do you describe "likely to be wrong"?`,
 a:`You need a language for it: the different ways a line can be false (assertions), and three layers of risk. Inherent risk is how error-prone the item is before any controls. Control risk is the entity's defences failing. Detection risk is your own procedures missing it. The first two are assessed. The third is yours to set.`,nodes:['c1','c2','c3','c4']},
{from:`Now you can sort the items.`,q:`Which items carry risk, and which carry the most?`,
 a:`Items with an identified risk are relevant, decided before looking at controls. The most demanding are near the top of the spectrum or forced by other standards. Risks can be pervasive or tied to one assertion, and material items cannot escape testing.`,nodes:['c5','c6','c7','c8']},
{from:`Finding the risks needs organising: people, time, a threshold, an order of work.`,q:`How do you organise the work before you know the risks?`,
 a:`Plan the looking first, because it needs only what you already know. The looking produces the assessment, and the assessment produces the plan for responding. A strategy sets where effort goes, a plan says what each person does, and both are updated as reality arrives.`,nodes:['d1','d2','d3','d4','d5','d6','d7','d8']},
{from:`Now the looking itself.`,q:`How do you find the risks?`,
 a:`Like a diagnosis: ask, compare against normal, observe, and read earlier records. Learn the entity (structure, business model, environment, performance pressure, framework), then ask where it is vulnerable.`,nodes:['e1','e2','e3','e4','e5','e6','e7']},
{from:`That gives the inherent half of the picture.`,q:`What defences does the entity have, and what are the assessed risks?`,
 a:`Coming next: the system of internal control (control risk) and the identification and assessment of risks.`,nodes:['e8','e9']},
{from:`Assessed risks drive the response.`,q:`How do you respond, and what counts as evidence?`,
 a:`Coming: responses at the whole-statement and assertion levels, tests of controls and substantive procedures, relevance and reliability of evidence, fraud, quality and documentation.`,nodes:['f1','f2','f3','f4','f5']},
{from:`The work will turn up errors.`,q:`What do you do with a misstatement?`,
 a:`Count it if it is above the floor, ask what it reveals, watch the headroom, tell management, recalibrate materiality, then judge the tally by size and by nature.`,nodes:['g1','g2','g3','g4','g5','g6','g7','g8','g9']},
{from:`Finally, conclude.`,q:`How does it become an opinion?`,
 a:`Three conclusions meet: enough evidence, whether uncorrected misstatements are material, and whether presentation is fair. The 700-series standards are coming.`,nodes:['g10','h1','h2']}
];

const THREADS=[
{t:`The purpose thread`,path:['a1','b2','g8','g10'],s:`Every rule is tested by one question: would it change what a reader decides? That is why the opinion is about the rules being followed, why materiality is defined by user decisions, and why the tally is judged on size and on nature.`},
{t:`Materiality travels`,path:['b2','b3','d2','c5','c8','f2','g7','g8'],s:`Set early as a planning input, materiality decides which classes carry risk and how much work each needs. A safety net forces testing of material classes even when no risk was found. At the end it is rechecked against actual results and applied to what you found.`},
{t:`Materiality moves`,path:['b6','g7','b5'],s:`The planning number rests on estimates. If actual results or new facts change it, the working amount and the procedures planned at the coarser level may no longer leave headroom.`},
{t:`Headroom`,path:['b5','g4','d6'],s:`Performance materiality builds a buffer before you start. The tally of found errors uses that buffer up. When the tally nears the line, the plan has to change.`},
{t:`Gate information`,path:['a3','d2','e1'],s:`What you learn at acceptance is not filed away. It shapes the strategy and has to be considered in risk assessment.`},
{t:`First-year audits`,path:['a3','d7','e1'],s:`A first-year audit lacks the auditor's own history, so planning may need to be wider: predecessor communication, major issues discussed at selection, opening balances.`},
{t:`The premise thread`,path:['a2','a3','a4','h2'],s:`The premise is the audit's foundation. The gate tests it before starting. If it fails mid-audit, for example access is blocked, a failed objective leads to disclaiming or withdrawing, or to a modified opinion.`},
{t:`The skepticism thread`,path:['a5','e1','g3','g6'],s:`Skepticism is an attitude, not a procedure. It starts at risk assessment (do not look only for confirmation), shows up when an error appears (what caused it?), and again when management refuses to correct (what does that tell me?).`},
{t:`Understanding the entity`,path:['e2','e3','e4','e5','e6','e7','c4'],s:`The doctor's questions in order: constitution, business model, environment, performance pressure, rulebook. Each answer feeds one synthesis: where is this entity vulnerable, and how much.`},
{t:`Pressure`,path:['e3','e5','c3','c4','g8'],s:`Business risk and performance measures create incentives. Incentives create room for bias, which is a risk factor. That raises likelihood, and it finally decides how a found misstatement is weighed (covenants, compensation).`},
{t:`Fraud`,path:['d5','e5','c6','f4','g3'],s:`Fraud runs through the whole audit. The team conference emphasises it, pressures raise it, assessed fraud risks are significant risks, a dedicated standard governs it, and a found misstatement may signal it.`},
{t:`Resources`,path:['d2','d4','f1'],s:`Planning asks what is needed. The quality standards ask whether it was provided. Overall responses adjust the same levers when risk assessment calls for it.`},
{t:`Pervasive risks`,path:['c7','f1','d4'],s:`A risk that touches the whole statements cannot be answered by one procedure. It changes who works on the audit and how closely they are supervised.`},
{t:`Limits and detection`,path:['b1','c2','f2','f3','h1'],s:`Because certainty is impossible, the auditor controls only detection risk. Higher entity-side risk means less detection risk is acceptable, so evidence must be more persuasive, and the opinion rests on that evidence.`},
{t:`Assertions aim the work`,path:['c1','c3','c5','f2'],s:`Assertions say how a line can be false. Inherent risk factors say which are likely. Relevant assertions decide where procedures are aimed.`},
{t:`Symptoms`,path:['g3','c2','d6','d3'],s:`A found error is information about the control system and the plan, not only a number for the tally.`},
{t:`Related parties`,path:['b4','c3','c6','g1','g8'],s:`A small amount can matter because of what it is: a lower materiality level, a bias and fraud pressure, a possible trigger for significant risk, and a reason a small item is not clearly trivial.`},
{t:`The owner-manager`,path:['e2','b3','g9'],s:`Where the owner also manages, the line between management and governance collapses. That affects the profit benchmark (before owner remuneration) and how misstatements are communicated.`},
{t:`Iterative planning`,path:['d1','d8','e1','e7','c5','d3','d6'],s:`Plan the looking early, look, assess, plan the responding, update. Each pass refines the last.`},
{t:`Next installments`,path:['c2','e8','e9','f2'],s:`Control risk is one half of the risk model. The internal control installments explain the entity's defences. Identifying and assessing risks then produces what the response standard works from.`},
{t:`Documentation`,path:['a5','b3','d6','g10','f5'],s:`Judgments, the factors behind materiality, plans and changes, thresholds and tallies are all recorded for the file. The documentation standard ties it together.`},
{t:`How firm is the evidence`,path:['f3','g2','g8'],s:`The three types of misstatement help in evaluating them and in discussing them with management. How firm each one is traces back to the quality of the evidence behind it.`},
{t:`Management's clean-up`,path:['g6','g5','f2'],s:`Asking management to correct is not the end. If management re-examines a population, you still perform procedures to check whether errors remain. That is further work on the same risk.`},
{t:`The opinion thread`,path:['g8','g10','h1','h2'],s:`The conclusion on the tally joins the evidence conclusion and the presentation evaluations to form the opinion, which may have to be modified.`}
];

 sugg:`Two things to test. A bespoke covenant basis is a special purpose framework, so acceptability depends on the entity and the purpose of the statements (ISA 200 A4, A9). And the premise includes unrestricted access to information and to people you determine you need. If you would decide the emails are necessary, the access limb is not acknowledged, and you stop at question 2.`,
 start:'q1',
 nodes:[
 {id:'q1',t:'q',short:`Framework acceptable?`,text:`Is the financial reporting framework acceptable for this entity and the purpose of the statements, or required by law?`,why:`If the yardstick is unsuitable, an opinion against it tells readers nothing useful.`,ref:`ISA 210 para 6(a); ISA 200 A4-A9`,y:'q2',n:'e1'},
 {id:'e1',t:'end',tone:'stop',text:`Do not accept the engagement unless law or regulation requires you to.`,note:`ISA 210 para 8. What follows when law compels acceptance is not yet covered.`,link:['a3']},
 {id:'q2',t:'q',short:`Premise acknowledged?`,text:`Has management acknowledged and understood its three duties: prepare the statements, keep the controls it decides are necessary, and give you access to information, extra information on request, and the people you need?`,why:`The audit is built on this premise. Without it the auditor would be preparing, or blind to, what she audits.`,ref:`ISA 200 13(j); ISA 210 para 6(b)`,y:'q3',n:'e2'},
 {id:'e2',t:'end',tone:'stop',text:`Do not accept unless law or regulation requires you to.`,note:`ISA 210 para 8. The same logic returns mid-audit if access is later blocked: ISA 200 paras 12 and 24 (disclaim or withdraw where law permits).`,link:['a2','a4']},
 {id:'q3',t:'q',short:`Management-imposed scope limit?`,text:`Is management imposing a limit on the scope of the audit that you expect would lead you to disclaim an opinion?`,why:`Starting work that cannot end in an opinion wastes everyone's time.`,ref:`ISA 210 para 7`,y:'e3',n:'q4'},
 {id:'e3',t:'end',tone:'stop',text:`Do not accept the engagement.`,note:`ISA 210 para 7.`,link:['a3']},
 {id:'q4',t:'q',short:`Ethics and independence?`,text:`Do ethics and independence requirements allow the firm and the team to act, with any threats absent or dealt with?`,why:`The opinion is trusted only if the auditor has no stake in the numbers.`,ref:`ISA 220 paras 16-21; ISA 200 para 14, A19`,y:'q5',n:'e4'},
 {id:'e4',t:'end',tone:'stop',text:`Do not proceed. Follow the firm's policies and the ethical code.`,note:`ISA 220 paras 16-21. The ethical code itself is not in your uploaded volumes.`,link:['a5']},
 {id:'q5',t:'q',short:`Competence, resources, integrity?`,text:`Does the firm have the competence, time and resources, and is there no integrity concern about management that should stop you continuing?`,why:`A quality audit needs the right people and an honest counterpart.`,ref:`ISA 220 paras 22-27; ISA 300 A6-A7`,y:'e6',n:'e5'},
 {id:'e5',t:'end',tone:'stop',text:`Do not proceed on current information. Follow the firm's acceptance and continuance policies.`,note:`ISA 220 paras 22-24.`,link:['a3']},
 {id:'e6',t:'end',tone:'go',text:`Proceed. Agree the terms in an engagement letter, then plan.`,note:`ISA 210 paras 9-13. What you learned here goes into the strategy (ISA 300 para 8(d)) and the risk assessment (ISA 315 para 15). In a first-year audit, also communicate with the predecessor where there is one (ISA 300 para 13). If you later learn something that would have made the firm decline, tell the firm promptly (ISA 220 para 24).`,link:['a3','d2','e1','d7']}
 ]},
t2:{name:`Decide now or wait?`,
 scen:`It is October. Year-end is 31 December. Stock was a risk last year and a new inventory system went live in September. Walk each decision: (a) book attendance at the year-end count, (b) set stock sample sizes, (c) decide whether to rely on warehouse controls, (d) book an IT specialist.`,
 sugg:`(a) Now: fixed date and an area you already expect to be significant, with the two brakes. (b) Wait: it must respond to assessed risk. (c) Wait: it depends on understanding the controls and on the assessment (ISA 330 para 7). (d) Now: understanding the IT environment is part of risk assessment itself, so you need the specialist before you can finish it.`,
 start:'q1',
 nodes:[
 {id:'q1',t:'q',short:`Needs assessed risks to design?`,text:`Does designing this decision need the assessed risks? Examples: sample sizes, specific substantive procedures, whether to rely on controls.`,why:`Further procedures must respond to assessed risks. You cannot respond to a diagnosis you do not have yet.`,ref:`ISA 330 paras 6-7`,y:'e1',n:'q2'},
 {id:'e1',t:'end',tone:'wait',text:`Wait. Settle it after risk assessment, then design it under the response standard.`,note:`This is the "planning the responding" part of the chain. The plan for it is completed after risk assessment (ISA 300 A15).`,link:['f2','d8']},
 {id:'q2',t:'q',short:`Needed by risk assessment itself?`,text:`Does the risk assessment itself need this decision? Examples: which procedures to run, who does them, when, the materiality figure, specialists.`,why:`You cannot diagnose without a team, a schedule and a threshold.`,ref:`ISA 300 A3; ISA 320 para 6(a); ISA 315 A55`,y:'e2',n:'q3'},
 {id:'e2',t:'end',tone:'go',text:`Settle it now, provisionally. Materiality comes from expected and normalised figures. Team and specialists are refined later.`,note:`ISA 320 A6 for the normalised figures. Revisit under ISA 320 para 12 and ISA 450 para 10.`,link:['b2','d4','e1']},
 {id:'q3',t:'q',short:`Fixed date in an expected-risky area?`,text:`Is it an event with a fixed date, in an area you already expect to be significant? Example: the year-end stock count.`,why:`Some evidence exists only on one day. Miss it and you cannot recreate it.`,ref:`ISA 300 A15`,y:'e3',n:'e1'},
 {id:'e3',t:'end',tone:'go',text:`Book it now, and stay open to revision.`,note:`Two brakes. The higher the risk, the more likely testing nearer period end or at unpredictable times is better, and interim conclusions may not extend to year-end where fraud risks exist (ISA 330 A11). And if unexpected misstatements show at an interim date, re-evaluate the risk assessment and planned procedures (ISA 330 para 23).`,link:['d1','f2']}
 ]},
t3:{name:`What status does this item get?`,
 scen:`Marlow buys fabric from Dana's relative: a few large invoices a year, in the normal course of business. Walk the related party purchases through the tree.`,
 sugg:`Question 1 is yes: bias or fraud pressure and qualitative significance count even though volume is low (my illustration of the relevant assertions: completeness and presentation of the related party disclosure). Upper end of the spectrum is a judgment call. The automatic route to significant risk applies to significant related party transactions outside the normal course of business, which these are not (ISA 550 para 18). This tree is the skeleton. Part 4 of ISA 315 will add the exact requirements.`,
 start:'q1',
 nodes:[
 {id:'q1',t:'q',short:`Reasonable possibility of material misstatement (ignoring controls)?`,text:`Ignoring controls, is there a reasonable possibility of a misstatement here that would be material if it happened? Think: complexity, subjectivity, change, uncertainty, bias; how much is at stake; volume and mix.`,why:`Identification must stand without controls, otherwise you could never discover that a control had failed.`,ref:`ISA 315 12(h); A7-A8; A16`,y:'s1',n:'q1b'},
 {id:'q1b',t:'q',short:`Material anyway?`,text:`Would omitting, misstating or obscuring this class, balance or disclosure still influence users' decisions?`,why:`A class can be material even though no risk was found.`,ref:`ISA 315 A233-A234`,y:'e1',n:'e2'},
 {id:'e1',t:'end',tone:'go',text:`No relevant assertion, but still perform substantive procedures.`,note:`ISA 330 para 18. Example given in the standard: an executive compensation disclosure.`,link:['c8','f2']},
 {id:'e2',t:'end',tone:'info',text:`No relevant assertion and not material: no risk-driven work. Keep it under watch.`,note:`Risk assessment is iterative (ISA 315 para 7), so revisit if new information appears.`,link:['d1']},
 {id:'s1',t:'s',short:`Mark relevant assertions`,text:`Mark each affected assertion as relevant. The class, balance or disclosure is now a significant class.`,ref:`ISA 315 12(h), 12(k)`,next:'q2'},
 {id:'q2',t:'q',short:`Upper end of the spectrum?`,text:`Does the combination of likelihood and magnitude sit near the upper end of the spectrum? A very high magnitude with low likelihood can still count.`,why:`Significant risks get the most demanding response.`,ref:`ISA 315 12(l); A208-A213`,y:'e3',n:'q3'},
 {id:'q3',t:'q',short:`Another standard forces significance?`,text:`Does another standard require you to treat it as significant? Two named cases: assessed fraud risks, and significant related party transactions outside the normal course of business.`,why:`Some risks are significant by rule, whatever the spectrum says.`,ref:`ISA 240 para 28; ISA 550 para 18`,y:'e3',n:'s2'},
 {id:'e3',t:'end',tone:'alert',text:`Significant risk: the most demanding response.`,note:`ISA 315 12(l). Part 4 will add what this triggers.`,link:['c6','f4']},
 {id:'s2',t:'s',short:`Record lower on spectrum`,text:`Record it as a risk of material misstatement lower on the spectrum. Next: assess control risk separately (internal control installments).`,ref:`ISA 315 paras 4-5`,next:'q4'},
 {id:'q4',t:'q',short:`Pervasive?`,text:`Does it relate pervasively to the statements as a whole, touching many assertions?`,why:`Pervasive risks drive overall responses. Others drive specific procedures.`,ref:`ISA 200 A37-A38; ISA 315 A215`,y:'e4',n:'e5'},
 {id:'e4',t:'end',tone:'info',text:`Also record it at the financial statement level. It will shape overall responses.`,note:`Examples: weak control environment, lack of accounting skills.`,link:['c7','f1']},
 {id:'e5',t:'end',tone:'info',text:`Assertion-level risk: it will drive specific procedures.`,note:`Nature, timing and extent come after the assessment.`,link:['c4','f2']}
 ]},
t4:{name:`Found a difference: what now?`,
 scen:`Cutoff test: 12,000 of January shipments are recorded in December. Illustration numbers: clearly trivial 5,000, materiality 100,000, performance materiality 75,000, tally so far 48,000. The warehouse team does not check dispatch dates.`,
 sugg:`Not trivial, so accumulate it as factual. The cause is a control gap, so others are likely: revisit the risk assessment and plan, for example extend cutoff testing. The tally is now 60,000 against a working amount of 75,000 with areas still untested, so headroom is shrinking and question 3 is probably yes. Then tell management and carry on down the tree.`,
 start:'q1',
 nodes:[
 {id:'q1',t:'q',short:`Clearly trivial?`,text:`Is it clearly trivial, by size and by nature? If in doubt, it is not.`,why:`Below a floor you cannot afford to chase every drop. But some small items matter because of what they are.`,ref:`ISA 450 para 5; A2-A3`,y:'e1',n:'s1'},
 {id:'e1',t:'end',tone:'info',text:`Do not accumulate it. The threshold itself is documented.`,note:`ISA 450 para 15(a).`,link:['g1']},
 {id:'s1',t:'s',short:`Accumulate; classify`,text:`Accumulate it. Note whether it is factual, judgmental or projected.`,ref:`ISA 450 para 5; A6`,next:'q2'},
 {id:'q2',t:'q',short:`Suggests others exist?`,text:`Does its cause or nature suggest others exist? Think: a control breakdown, an assumption applied widely, a possible fraud indicator, the same class repeating.`,why:`A drip points to a pipe.`,ref:`ISA 450 para 6(a); A7; ISA 330 para 25; ISA 240 para 36`,y:'s2',n:'q3'},
 {id:'s2',t:'s',short:`Revisit risk assessment and plan`,text:`Revisit the risk assessment, strategy and plan. If fraud is possible, think beyond the amount: fraud is unlikely to be isolated, and management representations come into question.`,ref:`ISA 300 para 10; ISA 240 para 36; ISA 450 A22`,next:'q3'},
 {id:'q3',t:'q',short:`Tally nearing materiality?`,text:`Is the tally, plus what you could not detect, approaching materiality?`,why:`The tally counts only what you found. The headroom exists for what you did not.`,ref:`ISA 450 para 6(b); A8`,y:'s3',n:'s4'},
 {id:'s3',t:'s',short:`Consider revising the plan`,text:`Consider revising the strategy and plan: more work, less headroom.`,ref:`ISA 450 para 6(b); ISA 300 para 10`,next:'s4'},
 {id:'s4',t:'s',short:`Tell management`,text:`Tell management about all accumulated items promptly and ask for correction.`,ref:`ISA 450 para 8; A10`,next:'q4'},
 {id:'q4',t:'q',short:`Management corrected it?`,text:`Did management correct it?`,why:`Correction keeps the accounts right. A refusal is information.`,ref:`ISA 450 paras 8-9`,y:'q5',n:'s5'},
 {id:'s5',t:'s',short:`Ask why`,text:`Ask why not. Management's reasons go into your judgment about bias and about whether the statements as a whole are free of material misstatement.`,ref:`ISA 450 para 9; A13; ISA 700 para 12`,next:'q6'},
 {id:'q5',t:'q',short:`Population clean-up?`,text:`Was the correction a management clean-up of a whole population?`,why:`Management's own re-examination is not audit evidence.`,ref:`ISA 450 para 7; A9`,y:'s6',n:'q6'},
 {id:'s6',t:'s',short:`Test the clean-up`,text:`Perform procedures to check whether misstatements remain. The clean-up is not audit evidence.`,ref:`ISA 450 para 7; A9`,next:'q6'},
 {id:'q6',t:'q',short:`Materiality now lower?`,text:`Reassess materiality against actual results. Is it now lower than planned?`,why:`Materiality was set from estimates.`,ref:`ISA 450 para 10; A14-A15`,y:'s7',n:'q7'},
 {id:'s7',t:'s',short:`Revisit working amount`,text:`Reconsider performance materiality, and whether the planned procedures still give enough evidence.`,ref:`ISA 320 para 13; ISA 450 A15`,next:'q7'},
 {id:'q7',t:'q',short:`Material, all things considered?`,text:`Judged on size, nature and circumstances, individually and with other uncorrected items and prior-period effects, is the uncorrected misstatement material? Think: its own class level, covenants, compensation, ratios, trends, related parties, and offsetting only with care.`,why:`The bucket may be under the line while one drop is harmful by its nature.`,ref:`ISA 450 para 11; A16-A25`,y:'e2',n:'e3'},
 {id:'e2',t:'end',tone:'alert',text:`Material and uncorrected: tell governance and ask them to correct. If it stays uncorrected, the opinion is affected.`,note:`ISA 450 para 12. How the opinion is modified is ISA 705, not yet covered.`,link:['g8','g10','h2']},
 {id:'e3',t:'end',tone:'go',text:`Not material: tell governance about uncorrected items, obtain the written representation, and document the threshold, the items and the conclusion.`,note:`ISA 450 paras 12-15; A27-A30. With many small items, their number and total may do. The representation is evidence of management's position, not of its truth.`,link:['g9','g10']}
 ]}
};
const TONE={stop:`Stop`,go:`Proceed`,wait:`Wait`,alert:`Focus here`,info:`Note`};
