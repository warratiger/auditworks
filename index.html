/* ---------- HELPERS ---------- */
const $=(sel,el)=>(el||document).querySelector(sel);
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){ const v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  for(let i=2;i<arguments.length;i++){
    const kids=[].concat(arguments[i]);
    kids.forEach(kid=>{ if(kid==null||kid===false) return; e.append(kid.nodeType?kid:document.createTextNode(kid)); });
  }
  return e;
}
const NS='http://www.w3.org/2000/svg';
function s(tag,attrs){
  const e=document.createElementNS(NS,tag);
  if(attrs) for(const k in attrs){ const v=attrs[k];
    if(v==null||v===false) continue;
    if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  for(let i=2;i<arguments.length;i++){
    const kids=[].concat(arguments[i]);
    kids.forEach(kid=>{ if(kid==null||kid===false) return; e.append(kid.nodeType?kid:document.createTextNode(kid)); });
  }
  return e;
}
const nodeById={}; NODES.forEach(n=>{nodeById[n.id]=n;});
const col=b=>'var('+BR[b].c+')';
const letterOf=n=>n.id.toUpperCase();

const adj={}, threadsOf={};
function addLink(a,b,ti){
  [[a,b],[b,a]].forEach(p=>{
    adj[p[0]]=adj[p[0]]||new Map();
    if(!adj[p[0]].has(p[1])) adj[p[0]].set(p[1],new Set());
    adj[p[0]].get(p[1]).add(ti);
  });
}
THREADS.forEach((t,ti)=>{
  t.path.forEach((id,i)=>{
    (threadsOf[id]=threadsOf[id]||[]).push(ti);
    if(i>0) addLink(t.path[i-1],id,ti);
  });
});

const state={tab:'chain',sel:'root',collapsed:new Set(),tree:'t1',cur:null,path:[],reveal:false};
const TABS=['chain','map','decisions','threads'];
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function chip(id){
  const n=nodeById[id];
  return h('button',{class:'chip'+(n.st==='next'?' next':''),type:'button',style:'--c:'+col(n.b),title:n.ref,onclick:()=>goTo(id)},n.label);
}

/* ---------- CHAIN ---------- */
function renderChain(){
  $('#p-chain').replaceChildren(
    h('p',{class:'intro'},`Each step starts from a problem the previous step left open. Read it top to bottom once, then use the Map to see how each idea connects sideways. Topic chips open the Map.`),
    h('ol',{class:'chain'},CHAIN.map((st,i)=>
      h('li',{class:'step'},
        h('div',{class:'rail'},h('span',{class:'num'},String(i+1))),
        h('div',{class:'stepbody'},
          h('p',{class:'from'},st.from),
          h('h3',null,st.q),
          h('p',null,st.a),
          h('div',{class:'chips'},st.nodes.map(chip))
        )))));
}

/* ---------- MAP ---------- */
const RX=8,RW=146,BX=196,BW=196,CX=456,CW=284,ROW=30,GAP=12,W=830;
function layout(){
  const pos={}; let y=26;
  BR_ORDER.forEach(b=>{
    const kids=NODES.filter(n=>n.b===b);
    if(state.collapsed.has(b)){ pos[b]={x:BX,y:y+ROW/2}; y+=ROW+GAP; return; }
    const ys=[];
    kids.forEach(n=>{ pos[n.id]={x:CX,y:y+ROW/2}; ys.push(y+ROW/2); y+=ROW; });
    pos[b]={x:BX,y:(ys[0]+ys[ys.length-1])/2}; y+=GAP;
  });
  const bys=BR_ORDER.map(b=>pos[b].y);
  pos.root={x:RX,y:(bys[0]+bys[bys.length-1])/2};
  return {pos:pos,height:y+6};
}
function curve(x1,y1,x2,y2){ const xm=(x1+x2)/2; return 'M'+x1+' '+y1+' C'+xm+' '+y1+' '+xm+' '+y2+' '+x2+' '+y2; }

function renderMap(){
  const L=layout(), pos=L.pos;
  const sel=state.sel;
  const nbrs=(adj[sel]&&nodeById[sel])?adj[sel]:new Map();
  const svg=s('svg',{width:W,height:L.height,viewBox:'0 0 '+W+' '+L.height,role:'group','aria-label':'Mind map of topics, grouped by branch'});
  const g=s('g');
  svg.append(g);
  /* connectors */
  BR_ORDER.forEach(b=>{
    g.append(s('path',{class:'conn-line',d:curve(RX+RW,pos.root.y,BX,pos[b].y)}));
    if(!state.collapsed.has(b)) NODES.filter(n=>n.b===b).forEach(n=>{
      g.append(s('path',{class:'conn-line',d:curve(BX+BW,pos[b].y,CX,pos[n.id].y)}));
    });
  });
  /* selected-node arcs */
  if(nodeById[sel]&&pos[sel]){
    nbrs.forEach((set,nid)=>{
      if(!pos[nid]) return;
      const ya=pos[sel].y, yb=pos[nid].y, x=CX+CW, d=Math.min(80,22+Math.abs(yb-ya)*0.3);
      g.append(s('path',{class:'arc',d:'M'+x+' '+ya+' C'+(x+d)+' '+ya+' '+(x+d)+' '+yb+' '+x+' '+yb}));
      g.append(s('circle',{class:'arcdot',cx:x,cy:yb,r:3.2}));
    });
  }
  /* root */
  const rootG=s('g',{class:'bnode',style:'--c:var(--fg)',tabindex:0,role:'button','aria-label':'Root: trust in the accounts',onclick:()=>select('root'),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select('root');}}});
  rootG.append(s('rect',{x:RX,y:pos.root.y-18,width:RW,height:36,rx:7,style:'fill:var(--fg)'}));
  rootG.append(s('text',{class:'rlbl',x:RX+RW/2,y:pos.root.y,'text-anchor':'middle','dominant-baseline':'central'},'Trust in the accounts'));
  g.append(rootG);
  /* branches */
  BR_ORDER.forEach(b=>{
    const p=pos[b], col_=col(b), isSel=(sel===b), coll=state.collapsed.has(b);
    const bg=s('g',{class:'bnode'+(BR[b].st==='next'?' next':'')+(isSel?' sel':''),style:'--c:'+col_,tabindex:0,role:'button','aria-expanded':String(!coll),'aria-label':'Branch '+b+': '+BR[b].n+(coll?', collapsed':', expanded'),
      onclick:()=>toggleBranch(b),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleBranch(b);}}});
    bg.append(s('rect',{x:BX,y:p.y-15,width:BW,height:30,rx:7}));
    bg.append(s('text',{class:'blbl',x:BX+12,y:p.y,'dominant-baseline':'central'},b+'   '+BR[b].n));
    const cx=BX+BW-16;
    bg.append(s('path',{class:'tick',style:'stroke:'+(BR[b].st==='next'?'var(--fg)':'var(--on)'),d:coll?('M'+(cx-2)+' '+(p.y-4)+' L'+(cx+3)+' '+p.y+' L'+(cx-2)+' '+(p.y+4)):('M'+(cx-4)+' '+(p.y-2)+' L'+cx+' '+(p.y+3)+' L'+(cx+4)+' '+(p.y-2))}));
    g.append(bg);
  });
  /* concepts */
  NODES.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const cls='node'+(n.st==='next'?' next':'')+(n.id===sel?' sel':'')+(nbrs.has(n.id)?' rel':'');
    const ng=s('g',{class:cls,style:'--c:'+col(n.b),tabindex:0,role:'button','data-id':n.id,'aria-label':n.label+(n.st==='next'?' (coming)':''),
      onclick:()=>select(n.id),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);}}});
    ng.append(s('rect',{class:'card',x:CX,y:p.y-12,width:CW,height:24,rx:5}));
    if(n.st==='next') ng.append(s('circle',{class:'ring',cx:CX+14,cy:p.y,r:4.5}));
    else ng.append(s('path',{class:'tick',d:'M'+(CX+9)+' '+p.y+' L'+(CX+13)+' '+(p.y+4)+' L'+(CX+20)+' '+(p.y-4)}));
    ng.append(s('text',{class:'lbl',x:CX+30,y:p.y,'dominant-baseline':'central'},n.label));
    g.append(ng);
  });
  const box=$('#mapbox');
  const top=box?box.scrollTop:0, left=box?box.scrollLeft:0;
  box.replaceChildren(svg);
  box.scrollTop=top; box.scrollLeft=left;
  return pos;
}

function renderDetail(){
  const d=$('#detail'); const sel=state.sel;
  if(sel==='root'){
    d.replaceChildren(
      h('span',{class:'pill taught'},'Start'),
      h('h3',null,'Trust in the accounts'),
      h('p',null,`Everything on this map serves one purpose: giving readers a justified level of trust in accounts written by people who benefit from them.`),
      h('p',null,`Click a branch to fold or unfold it. Click a topic to see the question it answers, the idea in plain words, the technical wording, and what it connects to. Dashed arcs show the connections of the selected topic.`),
      h('h4',null,'Branches'),
      h('div',{class:'chips'},BR_ORDER.map(b=>h('button',{class:'chip'+(BR[b].st==='next'?' next':''),type:'button',style:'--c:'+col(b),onclick:()=>select(b)},b+'  '+BR[b].n)))
    );
    return;
  }
  if(BR[sel]){
    const b=sel;
    d.replaceChildren(
      h('span',{class:'pill branch',style:'--c:'+col(b)},'Branch '+b),
      h('h3',null,BR[b].n),
      h('p',null,BR[b].blurb),
      h('h4',null,'Topics'),
      h('div',{class:'chips'},NODES.filter(n=>n.b===b).map(n=>chip(n.id)))
    );
    return;
  }
  const n=nodeById[sel];
  const nb=[]; (adj[sel]||new Map()).forEach((set,nid)=>{ nb.push([nid,[...set].map(i=>THREADS[i].t)]); });
  d.replaceChildren(
    h('div',{class:'chips'},
      h('span',{class:'pill branch',style:'--c:'+col(n.b)},'Branch '+n.b+'  '+BR[n.b].n),
      h('span',{class:'pill '+(n.st==='next'?'coming':'taught')},n.st==='next'?'Coming':'Taught')),
    h('h3',null,n.label),
    h('h4',null,'The question that leads here'),
    h('p',null,n.q),
    h('h4',null,'The idea'),
    h('p',null,n.idea),
    h('h4',null,'The technical wording'),
    h('div',{class:'term'},n.term,h('span',{class:'mono'},n.ref)),
    h('h4',null,'Where it goes'),
    h('p',null,n.feeds),
    h('h4',null,'Connected to'),
    nb.length?h('ul',{class:'conn'},nb.map(x=>h('li',null,chip(x[0]),h('span',{class:'via'},'via '+x[1].join(', '))))):h('p',{class:'note-small'},'No threads run through this topic yet.')
  );
}

function select(id){
  state.sel=id; renderMap(); renderDetail();
  if(window.innerWidth<=900){ const d=$('#detail'); if(d) d.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); }
}
function toggleBranch(b){
  if(state.collapsed.has(b)) state.collapsed.delete(b); else state.collapsed.add(b);
  state.sel=b; renderMap(); renderDetail();
}
function goTo(id){
  const n=nodeById[id]; if(n) state.collapsed.delete(n.b);
  state.sel=id; setTab('map');
  const pos=renderMap(); renderDetail();
  const box=$('#mapbox');
  if(pos[id]&&box) box.scrollTo({top:Math.max(0,pos[id].y-box.clientHeight/2),behavior:reduce?'auto':'smooth'});
  if(window.innerWidth<=900){ const d=$('#detail'); if(d) d.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); }
}
function buildMapPanel(){
  const tick=s('svg',{width:16,height:12,viewBox:'0 0 16 12','aria-hidden':'true'},s('path',{class:'tick',style:'stroke:var(--fg)',d:'M2 6 L6 10 L14 2'}));
  const ring=s('svg',{width:16,height:12,viewBox:'0 0 16 12','aria-hidden':'true'},s('circle',{class:'ring',cx:8,cy:6,r:4.5}));
  const arc=s('svg',{width:30,height:12,viewBox:'0 0 30 12','aria-hidden':'true'},s('path',{class:'arc',d:'M2 6 L28 6'}));
  $('#p-map').replaceChildren(
    h('div',{class:'legend'},
      h('span',{class:'k'},tick,'Taught'),
      h('span',{class:'k'},ring,'Coming'),
      h('span',{class:'k'},arc,'Connection of the selected topic'),
      h('span',{class:'toolbar'},
        h('button',{class:'btn',type:'button',onclick:()=>{state.collapsed.clear();renderMap();}},'Expand all'),
        h('button',{class:'btn',type:'button',onclick:()=>{BR_ORDER.forEach(b=>state.collapsed.add(b));renderMap();}},'Collapse all'))),
    h('div',{class:'mapgrid'},
      h('div',{class:'mapbox',id:'mapbox'}),
      h('aside',{class:'detail',id:'detail','aria-live':'polite'})));
}

/* ---------- DECISIONS ---------- */
function tree(){ return TREES[state.tree]; }
function tnode(id){ return tree().nodes.find(n=>n.id===id); }
function startTree(id){ state.tree=id; state.cur=TREES[id].start; state.path=[]; state.reveal=false; renderDecisions(); }
function step(a){
  const n=tnode(state.cur);
  state.path.push({id:n.id,a:a});
  state.cur=(a==='y')?n.y:(a==='n')?n.n:n.next;
  renderWalker();
}
function back(){ const p=state.path.pop(); if(p){ state.cur=p.id; renderWalker(); } }
function idxOf(id){ return tree().nodes.findIndex(n=>n.id===id)+1; }
function routeText(n){
  const lab=id=>{ const t=tnode(id); return t.t==='end'?('Outcome: '+t.text):('step '+idxOf(id)); };
  if(n.t==='q') return 'Yes: '+lab(n.y)+'  |  No: '+lab(n.n);
  if(n.t==='s') return 'Then: '+lab(n.next);
  return '';
}
function renderWalker(){
  const box=$('#walker'); if(!box) return;
  const n=tnode(state.cur);
  const kids=[];
  if(state.path.length){
    kids.push(h('ol',{class:'wpath'},state.path.map(p=>{
      const q=tnode(p.id);
      return h('li',null,h('b',null,p.a==='y'?'Yes':p.a==='n'?'No':'Done'),h('span',null,q.short||q.text));
    })));
  }
  if(n.t==='end'){
    kids.push(h('div',{class:'out tone-'+n.tone},
      h('span',{class:'tonepill'},TONE[n.tone]),
      h('p',{class:'qtext'},n.text),
      h('p',null,n.note),
      n.link&&n.link.length?h('div',null,h('h4',{style:'margin:10px 0 6px;font:600 12px var(--font-ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)'},'Open on the Map'),h('div',{class:'chips'},n.link.map(chip))):null));
  } else {
    kids.push(h('p',{class:'qmeta'},(n.t==='q'?'Question ':'Step ')+idxOf(n.id)+' of '+tree().nodes.length+'  |  '+n.ref));
    kids.push(h('p',{class:'qtext'},n.text));
    if(n.why) kids.push(h('details',{class:'why'},h('summary',null,'Why ask this?'),h('p',null,n.why)));
    if(n.t==='q') kids.push(h('div',{class:'answers'},h('button',{class:'ans',type:'button',onclick:()=>step('y')},'Yes'),h('button',{class:'ans',type:'button',onclick:()=>step('n')},'No')));
    else kids.push(h('div',{class:'answers'},h('button',{class:'ans',type:'button',onclick:()=>step('c')},'Continue')));
  }
  kids.push(h('div',{class:'wnav'},
    h('button',{class:'btn',type:'button',disabled:!state.path.length,onclick:back},'Back'),
    h('button',{class:'btn',type:'button',onclick:()=>startTree(state.tree)},'Restart')));
  box.replaceChildren.apply(box,kids);
}
function renderDecisions(){
  const T=tree();
  const root=$('#p-decisions');
  if(!state.cur) state.cur=T.start;
  root.replaceChildren(
    h('p',{class:'intro'},`Answer one question at a time. Each question carries its reason, and each outcome links back to the topics on the Map. Marlow figures in the scenarios are illustrations.`),
    h('div',{class:'dpick',role:'group','aria-label':'Choose a decision tree'},Object.keys(TREES).map(k=>h('button',{class:'btn',type:'button','aria-pressed':String(k===state.tree),onclick:()=>startTree(k)},TREES[k].name))),
    h('div',{class:'dgrid'},
      h('div',null,
        h('div',{class:'scen'},
          h('h3',null,'Try it on Marlow'),
          h('p',null,T.scen),
          h('button',{class:'btn',type:'button','aria-pressed':String(state.reveal),onclick:()=>{state.reveal=!state.reveal;renderDecisions();}},state.reveal?'Hide suggested route':'Show suggested route'),
          state.reveal?h('div',{class:'sugg'},T.sugg):null)),
      h('div',{class:'walker',id:'walker','aria-live':'polite'})),
    h('details',{class:'all'},h('summary',null,'All steps in this tree'),
      h('ol',null,T.nodes.map(n=>h('li',null,
        n.t==='end'?h('b',null,(TONE[n.tone])+': '):null,
        n.text,
        h('span',{class:'route'},(n.t==='end'?'End of this route':routeText(n))+(n.ref?'  |  '+n.ref:''))))))
  );
  renderWalker();
}

/* ---------- THREADS ---------- */
function renderThreads(){
  $('#p-threads').replaceChildren(
    h('p',{class:'intro'},`A thread follows one idea through the standards. These are the links that keep the chain from turning into separate chunks. Open any chip to see it on the Map, where its connections show as dashed arcs.`),
    h('div',{class:'tgrid'},THREADS.map(t=>{
      const kids=[];
      t.path.forEach((id,i)=>{ if(i) kids.push(h('span',{class:'arrow','aria-hidden':'true'},'→')); kids.push(chip(id)); });
      return h('article',{class:'thread'},h('h3',null,t.t),h('p',null,t.s),h('div',{class:'tpath'},kids));
    })));
}

/* ---------- TABS ---------- */
function setTab(name){
  if(TABS.indexOf(name)<0) name='chain';
  state.tab=name;
  TABS.forEach(t=>{
    const b=$('#tab-'+t), p=$('#p-'+t);
    b.setAttribute('aria-selected',String(t===name));
    b.tabIndex=(t===name)?0:-1;
    p.hidden=(t!==name);
  });
  try{ if(location.hash.slice(1)!==name) history.replaceState(null,'','#'+name); }catch(e){}
  if(name==='map'){ renderMap(); renderDetail(); }
}
function init(){
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.addEventListener('click',()=>setTab(b.dataset.tab));
    b.addEventListener('keydown',e=>{
      const i=TABS.indexOf(b.dataset.tab);
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        const nx=TABS[(i+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length];
        setTab(nx); $('#tab-'+nx).focus();
      }
    });
  });
  renderChain(); buildMapPanel(); renderMap(); renderDetail();
  state.cur=TREES[state.tree].start; renderDecisions(); renderThreads();
  const start=(location.hash||'').slice(1);
  setTab(TABS.indexOf(start)>=0?start:'chain');
  window.addEventListener('hashchange',()=>{ const x=(location.hash||'').slice(1); if(TABS.indexOf(x)>=0&&x!==state.tab) setTab(x); });
}
init();
})();
</script>
